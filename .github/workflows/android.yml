name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # release 复用 debug 的 signingConfig（见 app/build.gradle.kts），所以
      # CI 必须放回本机那一份 debug.keystore，签出来的包才能覆盖安装。
      - name: Restore local debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::缺少 Secret ANDROID_DEBUG_KEYSTORE_B64，无法沿用本地签名"
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey | grep -E "Alias name|SHA1" | head -3

      - name: Install Android SDK platform
        run: |
          set -euo pipefail
          SDKROOT="${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}"
          echo "sdkmanager=$SDKROOT/cmdline-tools/latest/bin/sdkmanager"
          # AGP 9.5 的 compileSdk 37 / minorApiLevel 2 对应包名是
          # platforms;android-37.2（本机也是这么装的），不是 platforms;android-37。
          yes | "$SDKROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDKROOT/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.2" > /dev/null

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify signing certificate
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          SDKROOT="${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}"
          SIGNER=$(ls -1 "$SDKROOT"/build-tools/*/apksigner | sort -V | tail -1)
          echo "apksigner=$SIGNER"
          "$SIGNER" verify --print-certs "$APK" | tee certs.txt
          # 本地 debug.keystore 的证书指纹；不同则说明 CI 没有沿用本机签名。
          grep -q '4A:A3:EA:0C:A8:5E:03:66:39:6D:AA:83:BE:CE:4A:97:F1:2B:EB:C3' certs.txt

      - name: Name APK
        run: |
          set -euo pipefail
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          if [ -z "$VERSION" ]; then
            echo "::error::无法从 app/build.gradle.kts 读取 versionName"
            exit 1
          fi
          NAME="WyuTools-${VERSION}-release-$(date -u +%Y%m%d-%H%M).apk"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          ls -lh "$NAME"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WyuTools-release-apk
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 14
